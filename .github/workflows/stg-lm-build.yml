name: STG-LM build

on:
  push:
    branches: [stg-lm-1]
  pull_request:
    branches: [course-test-cloudflare]
    paths:
      - "frontend/**"
      - ".github/workflows/stg-lm-build.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: build-only-placeholder
      STG_LM_MODE: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run eval:stg
      - run: npm run build
