name: STG-LM Cloudflare Preview

on:
  workflow_dispatch:
  push:
    branches:
      - stg-lm-1
    paths:
      - stg-lm-preview/**
      - .github/workflows/stg-lm-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy standalone temporary Cloudflare preview
        working-directory: stg-lm-preview
        run: npx wrangler deploy --config wrangler.jsonc --temporary
